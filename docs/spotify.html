<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid TV · Spotify</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080A12;color:#fff;font:17px/1.5 -apple-system,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font-weight:500;font-size:24px;margin:0 0 12px}
p{color:rgba(255,255,255,.75);margin:0}
</style>
</head>
<body>
<div>
<h1 id="t">Einen Moment …</h1>
<p id="m">Die Anmeldung wird an deinen Fire TV übergeben.</p>
</div>
<script>
// Spotify leitet hierher zurueck. Im "state" steht die Adresse des Sticks im WLAN;
// der Code wird direkt dorthin weitergereicht. Diese Seite speichert nichts.
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), state = q.get('state') || '', err = q.get('error');
  var t = document.getElementById('t'), m = document.getElementById('m');
  if (err) { t.textContent = 'Abgebrochen'; m.textContent = 'Spotify hat die Anmeldung nicht erlaubt (' + err + ').'; return; }
  var target = state.split('~')[0];
  if (!code || !/^\d{1,3}(\.\d{1,3}){3}:\d{2,5}$/.test(target)) { t.textContent = 'Ungültiger Link'; m.textContent = 'Bitte den QR-Code auf dem Fernseher neu scannen.'; return; }
  location.replace('http://' + target + '/spotify?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state));
})();
</script>
</body>
</html>
